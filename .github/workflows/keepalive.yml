# Free Supabase projects pause after 7 days without activity.
# This pings the database every 3 days so signups and submissions keep working.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY
# (GitHub repo > Settings > Secrets and variables > Actions).
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 13 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
